<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar país</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    
  <div class="container mt-5">
    <h2 class="mb-4">Editar país</h2>

    <form id="country-form">
      <div class="mb-3">
        <label for="name" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="name" required />
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Descripción</label>
        <textarea class="form-control" id="description" rows="7" required></textarea>
      </div>
      <div class="mb-3">
        <label for="iso_code" class="form-label">Código ISO</label>
        <input type="text" class="form-control" id="iso_code" required />
      </div>
      <div class="mb-3">
        <label for="flag" class="form-label">URL de la bandera</label>
        <input type="text" class="form-control" id="flag" />
      </div>
      <button type="button" onclick="window.location = './index.html';" class="btn btn-secondary">Regresar</button>
      <button type="submit" class="btn btn-primary">Actualizar</button>
    </form>
  </div>

    <!-- PASOS A SEGUIR -->
<!-- 1. Validar si el PAÍS EXISTE usando su ID haciendo un fetch aquí: http://localhost:8000/api/country/6 -->
 <!-- 2. Si el PAÍS EXISTE, mostrar la información en el formulario de editar -->
  <!-- 3. Actualizar la información usando el API de actualizar http://localhost:8000/api/country/6 método PUT -->
<script>
    // VARIABLES GLOBALES
    // Obtener los parámetros de la URL
    const params = new URLSearchParams(window.location.search);
    // Obtener el valor de "countryId"
    const countryId = params.get('countryId');
    const accessToken = localStorage.getItem('access_token');
    const tokenType = localStorage.getItem('token_type');
  
    // Llamar a paso 1 para que se ejecute al cargar la página
    isCountryExist(countryId);

    // FUNCIONES
    // paso 1
    function isCountryExist (countryId) {

      if (!accessToken || !tokenType) {
        alert('No hay sesión activa.');
        return;
      }

      fetch(`http://localhost:8000/api/countries/${countryId}`, {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `${tokenType} ${accessToken}`
        }
      })
      .then(async response => {
        if (response.ok) {
            const data = await response.json();
            // alert("El País existe.");
            // aqui debe ir la funcion que va a reemplazar la data del formulario
            loadDataInForm(data);
        } else {
            alert("El País no existe.");
        }
      })
      .catch(error => {
        alert('Hubo un error interno: ' + error.message);
        console.error(error);
      });
    }
    // paso 2
    function loadDataInForm (data) {
        console.log(data);
        document.getElementById('name').value = data.name;
        document.getElementById('description').value = data.description;
        document.getElementById('iso_code').value = data.iso_code || '';
        document.getElementById('flag').value = data.flag || '';
        }
    // paso 3
    function updateCountry () {
      const name = document.getElementById('name').value;
      const description = document.getElementById('description').value;
      const iso_code = document.getElementById('iso_code').value;
      const flag = document.getElementById('flag').value;
          
      fetch(`http://localhost:8000/api/countries/${countryId}`, {
          method: 'PUT',
          headers: {
              'Content-Type': 'application/json',
              'Authorization': `${tokenType} ${accessToken}`
          },
          body: JSON.stringify({
              name: name,
              description: description,
              iso_code,
              flag
            })
      })
      .then(response => {
          if (response.ok) {
              alert("País actualizado.");
              window.location = './index.html';
          } else {
              alert("No se pudo actualizar el país.");
          }
      })
      .catch(error => {
          alert("Error: " + error.message);
          console.error(error);
      });
    }
  
    // EVENTOS - Detectar cuando se presione el botón Actualizar
    document.getElementById('country-form').addEventListener('submit', function (e) {
      e.preventDefault();
      updateCountry();
      });
    
</script>
</body>
</html>
