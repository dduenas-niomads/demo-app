<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crear Ciudad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4">Crear nueva Ciudad</h2>

    <form id="city-form">
      <div class="mb-3">
        <label for="name" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="name" required />
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Descripción</label>
        <textarea class="form-control" id="description" rows="5" required></textarea>
      </div>
      <div class="mb-3">
        <label for="country" class="form-label">Country</label>
        <select id="country" class="form-control">
          <option value="0">Seleccione un país</option>
        </select>
      </div>
      <!-- Añadida nueva función para añadir poblacion -->
      <div class="mb-3">
        <label for="population" class="form-label">Población</label>
        <input type="number" min="50" max="50000000" class="form-control" id="population" required />
      </div>
      <button type="button" onclick="window.location = './index.html';" class="btn btn-secondary">Regresar</button>
      <button type="submit" class="btn btn-primary">Crear</button>
    </form>
  </div>

  <script>
    const accessToken = localStorage.getItem('access_token');
    const tokenType = localStorage.getItem('token_type');
    obtenerListadoDePaises();

    document.getElementById('city-form').addEventListener('submit', function (e) {
      e.preventDefault();
      //Añadida nueva constante para registrar population

      const name = document.getElementById('name').value.trim();
      const description = document.getElementById('description').value.trim();
      const country = document.getElementById('country').value.trim();
      const population = parseInt(document.getElementById('population').value.trim());

      if (!accessToken || !tokenType) {
        alert('No hay sesión activa.');
        return;
      }

      fetch('http://localhost:8000/api/cities', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `${tokenType} ${accessToken}`
        },
        //Añade el campo poblacion al servidor
        body: JSON.stringify({
          name,
          description,
          country,
          population
        })
      })
      .then(response => {
        if (response.ok) {
          window.location.href = './index.html';
        } else {
          return response.json().then(data => {
            throw new Error(data.message || 'Error al crear la ciudad.');
          });
        }
      })
      .catch(error => {
        alert('Error de creación de ciudad: ' + error.message);
        console.error(error);
      });
    });

    function obtenerListadoDePaises() {      
        if (!accessToken && !tokenType) {
            errorMessage.textContent = 'No hay sesión activa.';
            return;
        }
        
        fetch('http://localhost:8000/api/countries', {
                headers: {
                'Authorization': `${tokenType} ${accessToken}`
                }
            })
        .then(response => response.json())
        .then(data => {
            countriesData = data;
            showDataInSelect(countriesData);
        })
        .catch(error => {
            console.error('Error al cargar los paises:', error);
        });
    }

    function showDataInSelect(data) {        
        const select = document.getElementById('country');
        select.innerHTML = ``;

        // crear opción vacía
        const emptyOption = document.createElement('option');
        // Asignar propiedades
        emptyOption.value = "0";            // El valor del emptyOption (atributo value)
        emptyOption.text = "Seleccione un país";           // El texto que se mostrará
        emptyOption.selected = true;             // Marcarlo como seleccionado (opcional)
        emptyOption.disabled = false;            // Habilitado (opcional)
        // Agregarlo a un select
        select.appendChild(emptyOption);

        // agregar todos los países
        data.forEach(country => {
            const option = document.createElement('option');
            // Asignar propiedades
            option.value = country.id;            // El valor del option (atributo value)
            option.text = country.flag + " " + country.name;           // El texto que se mostrará
            option.selected = false;             // Marcarlo como seleccionado (opcional)
            option.disabled = false;            // Habilitado (opcional)
            // Agregarlo a un select
            select.appendChild(option);
        });
    }
  </script>
</body>
</html>
