<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ciudades API</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .table th, .table td { vertical-align: middle; }
    .actions-list { list-style: none; padding: 0; margin: 0; display: flex; gap: 0.5em; }
    .error-message { color: #d9534f; font-weight: bold; margin-bottom: 1em; }
  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="mb-0">Listado de Ciudades</h1>
      <div>
        <button type="button" onclick="window.location = '../user.html';" class="btn btn-outline-primary me-2">Ir al perfil</button>
        <button type="button" onclick="window.location = './create.html';" class="btn btn-success">Crear ciudad</button>
      </div>
    </div>
    <div id="errorMessage" class="error-message"></div>
    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <select id="countrySelect" class="form-select"></select>
      </div>
      <div class="col-md-3">
        <button type="button" onclick="goToCountryCities();" class="btn btn-primary w-100">Ver ciudades del país</button>
      </div>
      <div class="col-md-5">
        <input type="text" class="form-control" placeholder="Buscar por nombre o descripción y presione ENTER" onkeyup="searchFilter(this, event);">
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>País</th>
            <th>Población</th>
            <th>Descripción</th>
            <th>Creado</th>
            <th>Actualizado</th>
            <th>Opciones</th>
          </tr>
        </thead>
        <tbody id="cities-table-body">
        <!-- Los datos se insertarán aquí -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const accessToken = localStorage.getItem('access_token');
    const tokenType = localStorage.getItem('token_type');
    let citiesData = [];
    const errorMessage = document.getElementById('errorMessage');

    loadData();
    loadCountries();

    function goToCountryCities() {
      const countryId = document.getElementById('countrySelect').value;
      if (countryId) {
        window.location = `./index.html?country_id=${countryId}`;
      } else {
        window.location = './index.html';
      }
    }

    function loadData() {
      errorMessage.textContent = '';
      if (!accessToken || !tokenType) {
        errorMessage.textContent = 'No hay sesión activa.';
        return;
      }
      const params = new URLSearchParams(window.location.search);
      const countryId = params.get('country_id');
      let url = 'http://localhost:8000/api/cities';
      if (countryId) {
        url += `?country_id=${countryId}`;
      }
      fetch(url, {
        headers: {
          'Authorization': `${tokenType} ${accessToken}`
        }
      })
      .then(response => response.json())
      .then(data => {
        citiesData = data;
        showDataOnTable(citiesData);
      })
      .catch(error => {
        errorMessage.textContent = 'Error al cargar las ciudades.';
        console.error(error);
      });
    }

    function showDataOnTable(data) {
      const tbody = document.getElementById('cities-table-body');
      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center">No hay ciudades para mostrar.</td></tr>';
        return;
      }
      data.forEach(city => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${city.id}</td>
          <td>${city.name}</td>
          <td>${city.country ? city.country.name : ''}</td>
          <td>${city.population ?? ''}</td>
          <td>${city.description}</td>
          <td>${new Date(city.created_at).toLocaleString()}</td>
          <td>${new Date(city.updated_at).toLocaleString()}</td>
          <td>
            <ul class="actions-list">
              <li><button class="btn btn-light btn-sm" onclick="updateCity(${city.id});">Editar</button></li>
              <li><button class="btn btn-danger btn-sm" onclick="destroyCity(${city.id});">Eliminar</button></li>
            </ul>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function updateCity(id) {
      window.location = `./edit.html?cityId=${id}`;
    }

    function loadCountries() {
      fetch('http://localhost:8000/api/countries', {
        headers: {
          'Authorization': `${tokenType} ${accessToken}`
        }
      })
      .then(response => response.json())
      .then(countries => {
        const select = document.getElementById('countrySelect');
        select.innerHTML = '<option value="">Seleccione un país</option>';
        countries.forEach(country => {
          select.innerHTML += `<option value="${country.id}">${country.name}</option>`;
        });
      });
    }

    function destroyCity(id) {
      const confirmed = window.confirm(`¿Estás seguro de eliminar la ciudad ${id}?`);
      if (!confirmed) return;
      if (!accessToken || !tokenType) {
        errorMessage.textContent = 'No hay sesión activa.';
        return;
      }
      fetch(`http://localhost:8000/api/cities/${id}`, {
        method: 'DELETE',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `${tokenType} ${accessToken}`
        }
      })
      .then(response => {
        if (response.ok) {
          window.location.href = './index.html';
        } else {
          return response.json().then(data => {
            throw new Error(data.message || 'Error al eliminar ciudad.');
          });
        }
      })
      .catch(error => {
        errorMessage.textContent = 'Error de eliminación de ciudad: ' + error.message;
        console.error(error);
      });
    }

    function searchFilter(element, event) {
      if (event.key === 'Enter') {
        let filteredText = element.value.toLowerCase();
        let citiesDataFiltered = [];
        citiesData.forEach(city => {
          let cityNameAndDescription = city.name.toLowerCase() + city.description.toLowerCase();
          if (cityNameAndDescription.includes(filteredText)) {
            citiesDataFiltered.push(city);
          }
        });
        showDataOnTable(citiesDataFiltered);
      }
    }
  </script>
</body>
</html>
