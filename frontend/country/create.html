<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Administrar Country</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4">Administrar Country</h2>

    <form id="country-form">
      <div class="mb-3">
        <label for="name" class="form-label">Nombre del Country</label>
        <input type="text" class="form-control" id="name" required />
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Descripción</label>
        <textarea class="form-control" id="description" rows="4"></textarea>
      </div>
      <div class="mb-3">
        <label for="selected_country" class="form-label">Elegir país de referencia</label>
        <select class="form-select" id="selected_country" required>
          <option value="">-- Selecciona un país --</option>
          <option value="España">España</option>
          <option value="Francia">Francia</option>
          <option value="Italia">Italia</option>
          <option value="Alemania">Alemania</option>
          <option value="México">México</option>
          <option value="Argentina">Argentina</option>
          <option value="Chile">Chile</option>
          <option value="Colombia">Colombia</option>
          <option value="Estados Unidos">Estados Unidos</option>
          <option value="Canadá">Canadá</option>
          <option value="Ecuador">Ecuador</option>
          <option value="Perú">Perú</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="country_id" class="form-label">ID del Country (para editar o eliminar)</label>
        <input type="number" class="form-control" id="country_id" placeholder="Ejemplo: 1" />
      </div>
      <div class="d-flex gap-2">
        <button type="button" onclick="window.location = './index.html';" class="btn btn-secondary">Regresar</button>
        <button type="submit" class="btn btn-success">Crear</button>
        <button type="button" class="btn btn-primary" onclick="editarCountry()">Editar</button>
        <button type="button" class="btn btn-danger" onclick="eliminarCountry()">Eliminar</button>
      </div>
    </form>
  </div>

  <script>
    const apiUrl = 'http://localhost:8000/api/countries';

    // Crear
    document.getElementById('country-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const description = document.getElementById('description').value.trim();
      const selectedCountry = document.getElementById('selected_country').value;

      if (!selectedCountry) {
        alert('Debes seleccionar un país de referencia.');
        return;
      }

      const accessToken = localStorage.getItem('access_token');
      const tokenType = localStorage.getItem('token_type');

      if (!accessToken || !tokenType) {
        alert('No hay sesión activa.');
        return;
      }

      fetch(apiUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `${tokenType} ${accessToken}`
        },
        body: JSON.stringify({ name, description, reference_country: selectedCountry })
      })
      .then(response => {
        if (response.ok) {
          alert('Country creado correctamente.');
          window.location.href = './index.html';
        } else {
          return response.json().then(data => {
            throw new Error(data.message || 'Error al crear el country.');
          });
        }
      })
      .catch(error => {
        alert('Error de creación de country: ' + error.message);
        console.error(error);
      });
    });

    // Editar
    function editarCountry() {
      const id = document.getElementById('country_id').value.trim();
      const name = document.getElementById('name').value.trim();
      const description = document.getElementById('description').value.trim();
      const selectedCountry = document.getElementById('selected_country').value;

      if (!id) {
        alert('Debes indicar el ID del country que quieres editar.');
        return;
      }

      const accessToken = localStorage.getItem('access_token');
      const tokenType = localStorage.getItem('token_type');

      fetch(`${apiUrl}/${id}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `${tokenType} ${accessToken}`
        },
        body: JSON.stringify({ name, description, reference_country: selectedCountry })
      })
      .then(response => {
        if (response.ok) {
          alert('Country editado correctamente.');
          window.location.href = './index.html';
        } else {
          return response.json().then(data => {
            throw new Error(data.message || 'Error al editar el country.');
          });
        }
      })
      .catch(error => {
        alert('Error al editar el country: ' + error.message);
        console.error(error);
      });
    }

    // Eliminar
    function eliminarCountry() {
      const id = document.getElementById('country_id').value.trim();

      if (!id) {
        alert('Debes indicar el ID del country que quieres eliminar.');
        return;
      }

      const accessToken = localStorage.getItem('access_token');
      const tokenType = localStorage.getItem('token_type');

      if (!confirm('¿Estás seguro de que quieres eliminar este country?')) return;

      fetch(`${apiUrl}/${id}`, {
        method: 'DELETE',
        headers: {
          'Authorization': `${tokenType} ${accessToken}`
        }
      })
      .then(response => {
        if (response.ok) {
          alert('Country eliminado correctamente.');
          window.location.href = './index.html';
        } else {
          return response.json().then(data => {
            throw new Error(data.message || 'Error al eliminar el country.');
          });
        }
      })
      .catch(error => {
        alert('Error al eliminar el country: ' + error.message);
        console.error(error);
      });
    }
  </script>
</body>
</html>
