<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Country</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4">Add New Country</h2>

    <form id="country-form">
      <div class="mb-3">
        <label for="name" class="form-label">Country Name</label>
        <input type="text" class="form-control" id="name" placeholder="Example: Ecuador" required />
      </div>
      <div class="mb-3">
        <label for="iso" class="form-label">ISO Code (Example: EC, PE)</label>
        <input type="text" class="form-control" id="iso" maxlength="3" placeholder="e.g., EC" required />
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" rows="4" placeholder="Add a brief description of the country"></textarea>
      </div>
      <div class="d-flex gap-2">
        <button type="button" onclick="window.location = './index.html';" class="btn btn-secondary">Back</button>
        <button type="submit" class="btn btn-success">Create</button>
      </div>
    </form>
  </div>

  <script>
    const apiUrl = 'http://localhost:8000/api/countries';

    // Force ISO field to accept only letters and uppercase
    document.getElementById('iso').addEventListener('input', function () {
      this.value = this.value.replace(/[^a-zA-Z]/g, '').toUpperCase();
    });

    // Create new country
    document.getElementById('country-form').addEventListener('submit', function (e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const iso = document.getElementById('iso').value.trim().toUpperCase();
      const description = document.getElementById('description').value.trim();

      if (!name) {
        alert('Please enter the country name.');
        return;
      }

      if (!iso || iso.length < 2 || iso.length > 3) {
        alert('Please enter a valid ISO code (2 or 3 letters).');
        return;
      }

      const accessToken = localStorage.getItem('access_token');
      const tokenType = localStorage.getItem('token_type');

      if (!accessToken || !tokenType) {
        alert('No active session. Please log in to continue.');
        return;
      }

      fetch(apiUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `${tokenType} ${accessToken}`
        },
        body: JSON.stringify({ name, iso, description })
      })
      .then(response => {
        if (response.ok) {
          alert('Country created successfully.');
          window.location.href = './index.html';
        } else {
          return response.json().then(data => {
            throw new Error(data.message || 'Error creating the country.');
          });
        }
      })
      .catch(error => {
        alert('Error creating the country: ' + error.message);
        console.error(error);
      });
    });
  </script>
</body>
</html>
